services:
  db_lupa_maya:
    image: mysql:8.0
    container_name: lupa_maya_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - lupa_maya_db_data:/var/lib/mysql
    networks:
      - lupa_maya_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      network: host
    container_name: lupa_maya_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db_lupa_maya
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FRONTEND_URL: ${FRONTEND_URL}
    expose:
      - "5000"
    volumes:
      - lupa_maya_models:/app/public/models
      - lupa_maya_assets:/app/public/assets
    depends_on:
      db_lupa_maya:
        condition: service_healthy
    networks:
      - lupa_maya_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      network: host
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: lupa_maya_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - lupa_maya_net

networks:
  lupa_maya_net:
    driver: bridge

volumes:
  lupa_maya_db_data:
  lupa_maya_models:
  lupa_maya_assets: