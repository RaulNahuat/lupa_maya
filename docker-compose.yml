version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lupa_maya_backend
    restart: always
    environment:
      # Usamos la sintaxis ${VARIABLE} para que Docker lea tu archivo .env automáticamente
      NODE_ENV: production
      PORT: 5000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "5000:5000"
    networks:
      - lupa_maya_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: lupa_maya_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lupa_maya_net

networks:
  lupa_maya_net:
    external: true
    name: dokploy-network